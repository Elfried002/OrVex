name: OrVex Security

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  schedule:
    # Chaque mercredi à 10:27 UTC
    - cron: "27 10 * * 3"

  workflow_dispatch:

# Principe du moindre privilège
permissions:
  contents: read
  security-events: write

jobs:

  # ============================================================
  # 1. CODEQL — SAST
  # ============================================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"


  # ============================================================
  # 2. GITLEAKS — SECRET SCANNING
  # ============================================================
  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 3. PIP-AUDIT — PYTHON DEPENDENCIES
  # ============================================================
  dependency-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          else
            echo "No requirements.txt found."
          fi


  # ============================================================
  # 4. TRIVY — FILESYSTEM / VULNERABILITIES / SECRETS / MISCONFIG
  # ============================================================
  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif


  # ============================================================
  # 5. MICROSOFT SECURITY DEVOPS
  # ============================================================
  msdo:
    name: Microsoft Security DevOps
    runs-on: windows-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@v1.6.0
        id: msdo

      - name: Upload MSDO results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}


  # ============================================================
  # 6. PYTHON SAFETY CHECK
  # ============================================================
  python-check:
    name: Python Safety Check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        run: |
          python -m compileall -q .

      - name: Check Python syntax
        run: |
          python - <<'PY'
          import pathlib
          import py_compile
          import sys

          errors = []

          for path in pathlib.Path(".").rglob("*.py"):
              if ".git" in path.parts:
                  continue

              try:
                  py_compile.compile(
                      str(path),
                      doraise=True
                  )
              except Exception as exc:
                  errors.append((path, exc))

          if errors:
              print("Python syntax errors detected:")
              for path, error in errors:
                  print(f"- {path}: {error}")
              sys.exit(1)

          print("Python syntax check passed.")
          PY
